version: 2
project_name: entire-run

builds:
  - main: ./cmd/entire-run
    binary: entire-run
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

# Asset shape consumed by `entire plugin install`:
#   entire-run_<version>_<os>_<arch>.tar.gz (zip on Windows) + checksums.txt
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
